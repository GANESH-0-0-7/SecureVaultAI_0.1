spring.application.name=secure-cloud-file-sharing-backend
server.port=${SERVER_PORT:8080}
app.client-origins=${CLIENT_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-directory=${LOCAL_STORAGE_DIRECTORY:./.data/files}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase-bucket=${SUPABASE_BUCKET:encrypted-files}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.secret-file=${APP_JWT_SECRET_FILE:./.data/jwt-signing-key}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./.data/secure-cloud-files;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.data-migration.enabled=${MIGRATE_LOCAL_DATA:false}
app.data-migration.source-url=${LOCAL_DATASOURCE_URL:jdbc:h2:file:./.data/secure-cloud-files;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
app.data-migration.source-username=${LOCAL_DATASOURCE_USERNAME:sa}
app.data-migration.source-password=${LOCAL_DATASOURCE_PASSWORD:}
app.data-migration.source-file-directory=${LOCAL_STORAGE_DIRECTORY:./.data/files}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
